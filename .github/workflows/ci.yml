name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev fuse3
      - name: Run tests
        run: cargo test --locked
      - name: Verify exact live FUSE test inventory
        run: |
          test_inventory="$(cargo test --locked --test live_fuse -- --list)"
          for test_name in \
            'sigint_unmounts_flushes_and_exits_cleanly' \
            'sigterm_unmounts_flushes_and_exits_cleanly' \
            'sighup_unmounts_flushes_and_exits_cleanly' \
            'busy_mount_keeps_serving_until_files_are_closed'
          do
            printf '%s\n' "$test_inventory" | awk -v expected="$test_name: test" '$0 == expected { found += 1 } END { exit(found == 1 ? 0 : 1) }'
          done
      - name: Run live FUSE signal and busy-unmount tests
        timeout-minutes: 15
        env:
          ZDRIVE_RUN_LIVE_FUSE_TESTS: "1"
        run: cargo test --locked --test live_fuse -- --ignored --test-threads=1 --nocapture

  durability-ext4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FUSE and ext4 tools
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev fuse3 e2fsprogs
      - name: Verify x86_64 durability host
        run: uname -m | grep -Fx x86_64
      - name: Verify exact ext4 durability test inventory
        run: |
          test_inventory="$(cargo test --locked -- --list)"
          for test_name in \
            'v2::process_crash_tests::subprocess_sigkill_v2_durability_ext4' \
            'v2::process_crash_tests::subprocess_sigkill_v2_gc_ext4' \
            'v2::process_crash_tests::subprocess_sigkill_v1_to_v2_migration_ext4'
          do
            printf '%s\n' "$test_inventory" | awk -v expected="$test_name: test" '$0 == expected { found += 1 } END { exit(found == 1 ? 0 : 1) }'
          done
      - name: Create isolated ext4 test filesystem
        run: |
          truncate -s 1G "$RUNNER_TEMP/zerotrust-drive-ext4.img"
          mkfs.ext4 -F "$RUNNER_TEMP/zerotrust-drive-ext4.img"
          sudo mkdir -p /mnt/zerotrust-drive-ext4
          sudo mount -o loop "$RUNNER_TEMP/zerotrust-drive-ext4.img" /mnt/zerotrust-drive-ext4
          sudo chown "$(id -u):$(id -g)" /mnt/zerotrust-drive-ext4
      - name: Run real SIGKILL durability matrix on ext4
        env:
          ZDRIVE_RUN_PROCESS_CRASH_TESTS: "1"
          ZDRIVE_CRASH_TEST_ROOT: /mnt/zerotrust-drive-ext4
        run: |
          test_name='v2::process_crash_tests::subprocess_sigkill_v2_durability_ext4'
          cargo test --locked "$test_name" -- --exact --ignored --nocapture
      - name: Run real SIGKILL GC quarantine and restore matrices on ext4
        env:
          ZDRIVE_RUN_PROCESS_CRASH_TESTS: "1"
          ZDRIVE_CRASH_TEST_ROOT: /mnt/zerotrust-drive-ext4
        run: |
          test_name='v2::process_crash_tests::subprocess_sigkill_v2_gc_ext4'
          cargo test --locked "$test_name" -- --exact --ignored --nocapture
      - name: Run real SIGKILL v1-to-v2 migration matrix on ext4
        env:
          ZDRIVE_RUN_PROCESS_CRASH_TESTS: "1"
          ZDRIVE_CRASH_TEST_ROOT: /mnt/zerotrust-drive-ext4
        run: |
          test_name='v2::process_crash_tests::subprocess_sigkill_v1_to_v2_migration_ext4'
          cargo test --locked "$test_name" -- --exact --ignored --nocapture
      - name: Unmount ext4 test filesystem
        if: always()
        run: |
          if mountpoint -q /mnt/zerotrust-drive-ext4; then
            sudo umount /mnt/zerotrust-drive-ext4
          fi

  durability-apfs:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macFUSE
        run: brew install macfuse
      - name: Verify exact macOS inventory and run storage/presenter probes
        run: |
          test_inventory="$(cargo test --locked -- --list)"
          for test_name in \
            'storage::tests::macos_native_shim_coordinates_local_exact_paths' \
            'storage::tests::native_cloud_errors_keep_machine_readable_io_kinds' \
            'macos_integration_tests::ns_file_presenter_probe_observes_exact_descriptor_rooted_move' \
            'v2::process_crash_tests::subprocess_sigkill_v2_durability_apfs' \
            'v2::process_crash_tests::subprocess_sigkill_v2_gc_apfs' \
            'v2::process_crash_tests::subprocess_sigkill_v1_to_v2_migration_apfs'
          do
            printf '%s\n' "$test_inventory" | awk -v expected="$test_name: test" '$0 == expected { found += 1 } END { exit(found == 1 ? 0 : 1) }'
          done
          cargo test --locked 'storage::tests::macos_native_shim_coordinates_local_exact_paths' -- --exact --nocapture
          cargo test --locked 'storage::tests::native_cloud_errors_keep_machine_readable_io_kinds' -- --exact --nocapture
          cargo test --locked 'macos_integration_tests::' -- --test-threads=1 --nocapture
      - name: Run real SIGKILL durability matrix on APFS
        env:
          ZDRIVE_RUN_PROCESS_CRASH_TESTS: "1"
          ZDRIVE_CRASH_TEST_ROOT: ${{ runner.temp }}
        run: |
          test_name='v2::process_crash_tests::subprocess_sigkill_v2_durability_apfs'
          cargo test --locked "$test_name" -- --exact --ignored --nocapture
      - name: Run real SIGKILL GC quarantine and restore matrices on APFS
        env:
          ZDRIVE_RUN_PROCESS_CRASH_TESTS: "1"
          ZDRIVE_CRASH_TEST_ROOT: ${{ runner.temp }}
        run: |
          test_name='v2::process_crash_tests::subprocess_sigkill_v2_gc_apfs'
          cargo test --locked "$test_name" -- --exact --ignored --nocapture
      - name: Run real SIGKILL v1-to-v2 migration matrix on APFS
        env:
          ZDRIVE_RUN_PROCESS_CRASH_TESTS: "1"
          ZDRIVE_CRASH_TEST_ROOT: ${{ runner.temp }}
        run: |
          test_name='v2::process_crash_tests::subprocess_sigkill_v1_to_v2_migration_apfs'
          cargo test --locked "$test_name" -- --exact --ignored --nocapture

  release-linux:
    needs: [test, durability-ext4, durability-apfs]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            deb_arch: amd64
          - runner: ubuntu-22.04-arm
            arch: aarch64
            deb_arch: arm64
    # Pinned: the build host's glibc is the oldest the artifacts run on.
    # Ubuntu 22.04 (glibc 2.35) covers Debian 12 and Ubuntu 22.04 through
    # 26.04; ubuntu-latest moving to a newer release would raise it silently.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # fuser mounts through its pure-Rust path and fusermount3, so the build
      # needs no libfuse3-dev; dpkg-dev provides dpkg-shlibdeps.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Check tag against the crate version
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$version" != "$crate_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build release
        env:
          ZDRIVE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.ZDRIVE_GOOGLE_DESKTOP_CLIENT_ID }}
          ZDRIVE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.ZDRIVE_GOOGLE_DESKTOP_CLIENT_SECRET }}
          ZDRIVE_GOOGLE_DEVICE_CLIENT_ID: ${{ secrets.ZDRIVE_GOOGLE_DEVICE_CLIENT_ID }}
          ZDRIVE_GOOGLE_DEVICE_CLIENT_SECRET: ${{ secrets.ZDRIVE_GOOGLE_DEVICE_CLIENT_SECRET }}
        run: cargo build --release --locked
      - name: Prepare artifacts
        run: |
          mkdir dist
          cp target/release/zerotrust-drive "dist/zdrive-linux-${{ matrix.arch }}"
          packaging/linux/build-tarball.sh "$VERSION" "${{ matrix.arch }}" target/release/zerotrust-drive dist
          packaging/deb/build-deb.sh "$VERSION" "${{ matrix.deb_arch }}" target/release/zerotrust-drive dist
          ls -l dist
      - name: Prove the bundled Google OAuth clients
        if: startsWith(github.ref, 'refs/tags/v')
        run: packaging/check-bundled-clients.sh "dist/zdrive-linux-${{ matrix.arch }}"
      - name: Inspect the .deb
        run: |
          deb="dist/zerotrust-drive_${VERSION}_${{ matrix.deb_arch }}.deb"
          dpkg -I "$deb"
          dpkg -c "$deb"
      - name: Install the .deb and check its version
        run: |
          sudo apt-get install -y "./dist/zerotrust-drive_${VERSION}_${{ matrix.deb_arch }}.deb"
          dpkg-query -W -f '${Package} ${Version} ${Status}\n' zerotrust-drive fuse3
          installed="$(/usr/bin/zdrive --version)"
          echo "$installed"
          if [ "${installed##* }" != "$VERSION" ]; then
            echo "::error::installed zdrive reports '$installed', expected version $VERSION"
            exit 1
          fi
      - name: Smoke-test the installed zdrive through FUSE
        timeout-minutes: 5
        run: packaging/linux/smoke-test.sh /usr/bin/zdrive "$RUNNER_TEMP/zdrive-smoke"
      - uses: actions/upload-artifact@v7
        with:
          name: zdrive-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release-macos:
    needs: [test, durability-ext4, durability-apfs]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macFUSE
        run: brew install macfuse
      - name: Build release
        env:
          ZDRIVE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.ZDRIVE_GOOGLE_DESKTOP_CLIENT_ID }}
          ZDRIVE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.ZDRIVE_GOOGLE_DESKTOP_CLIENT_SECRET }}
          ZDRIVE_GOOGLE_DEVICE_CLIENT_ID: ${{ secrets.ZDRIVE_GOOGLE_DEVICE_CLIENT_ID }}
          ZDRIVE_GOOGLE_DEVICE_CLIENT_SECRET: ${{ secrets.ZDRIVE_GOOGLE_DEVICE_CLIENT_SECRET }}
        run: cargo build --release --locked
      - name: Prepare artifact
        run: |
          mkdir dist
          cp target/release/zerotrust-drive dist/zdrive-macos-aarch64
      - name: Prove the bundled Google OAuth clients
        if: startsWith(github.ref, 'refs/tags/v')
        run: packaging/check-bundled-clients.sh dist/zdrive-macos-aarch64
      - uses: actions/upload-artifact@v7
        with:
          name: zdrive-macos-aarch64
          path: dist/
          if-no-files-found: error

  publish-release:
    needs: [release-linux, release-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: zdrive-*
          path: dist
          merge-multiple: true
      - name: Check the asset set and write SHA256SUMS
        working-directory: dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="$(printf '%s\n' \
            zdrive-linux-x86_64 \
            zdrive-linux-aarch64 \
            zdrive-macos-aarch64 \
            "zdrive-${version}-linux-x86_64.tar.gz" \
            "zdrive-${version}-linux-aarch64.tar.gz" \
            "zerotrust-drive_${version}_amd64.deb" \
            "zerotrust-drive_${version}_arm64.deb" | LC_ALL=C sort)"
          actual="$(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::release assets differ from the expected set"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          printf '%s\n' "$expected" | xargs sha256sum -- > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: true
          files: |
            dist/zdrive-linux-x86_64
            dist/zdrive-linux-aarch64
            dist/zdrive-macos-aarch64
            dist/zdrive-*-linux-*.tar.gz
            dist/zerotrust-drive_*.deb
            dist/SHA256SUMS
