[package]
name = "zerotrust-drive"
version = "0.11.0"
license = "AGPL-3.0-only"
edition = "2024"

[dependencies]
fuser = "0.17"
# AEAD: XChaCha20-Poly1305 (24-byte nonce) as of the v1 on-disk format.
# ChaCha20-Poly1305 (12-byte nonce) is retained from the same crate for
# reading pre-0.7 (v0) blobs during format migration only.
chacha20poly1305 = "0.10"
# Memory-hard passphrase KDF (Argon2id) — replaces the homemade v0 KDF.
argon2 = "0.5"
# Streaming full-ciphertext fingerprints for crash-recovery manifests.
blake2 = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
