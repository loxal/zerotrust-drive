[package]
name = "zerotrust-drive"
version = "0.19.2"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.88"

[dependencies]
fuser = "0.18"
# AEAD: XChaCha20-Poly1305 (24-byte nonce) as of the v1 on-disk format.
# ChaCha20-Poly1305 (12-byte nonce) is retained from the same crate for
# reading pre-0.7 (v0) blobs during format migration only.
chacha20poly1305 = "0.11"
# Memory-hard passphrase KDF (Argon2id) — replaces the homemade v0 KDF.
# Only raw key derivation is used, so the PHC password-hash API stays off.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
# Streaming full-ciphertext fingerprints for crash-recovery manifests.
blake2 = "0.11"
# Operating-system CSPRNG for salts, nonces and object identifiers; the
# RustCrypto AEAD crates no longer re-export `OsRng`.
getrandom = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# Blocking HTTPS client for the Google Drive REST remote. rustls with ring and
# bundled webpki roots keeps release builds free of OpenSSL and system trust
# store differences; gzip stays off because remote payloads are ciphertext.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# PKCE S256 code challenge for the OAuth installed-app flow.
sha2 = "0.11"
# Drive reports md5Checksum for uploaded content; it is compared against the
# local pack bytes only as a transfer check, never as an integrity boundary.
md-5 = "0.11"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"
